name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: horama-windows-x64.zip
          - os: ubuntu-latest
            artifact_name: horama-ubuntu-x64.tar.gz
          - os: macos-latest
            artifact_name: horama-macos.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libx11-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev libgl1-mesa-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Both programs: horama (egui) and horama-slint (the previous interface, kept for one
      # version). Build paths are replaced by short names so that no folder of the build
      # machine ends up inside the executables.
      - name: Build Optimized Release Binaries
        shell: bash
        run: |
          CARGO_DIR="${CARGO_HOME:-$HOME/.cargo}"
          if [ "$RUNNER_OS" = "Windows" ]; then CARGO_DIR="$(cygpath -w "$CARGO_DIR")"; fi
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=horama --remap-path-prefix=$CARGO_DIR=cargo"
          cargo build --release --bins

      - name: Package Windows Artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir staging
          Copy-Item target/release/horama.exe staging/
          Copy-Item target/release/horama-slint.exe staging/
          Copy-Item LICENSE staging/
          Copy-Item README.md staging/
          Compress-Archive -Path staging/* -DestinationPath ${{ matrix.artifact_name }}

      - name: Package Ubuntu Artifact
        if: runner.os == 'Linux'
        run: |
          mkdir staging
          cp target/release/horama staging/
          cp target/release/horama-slint staging/
          cp LICENSE staging/
          cp README.md staging/
          tar -czvf ${{ matrix.artifact_name }} -C staging .

      - name: Package macOS Artifact
        if: runner.os == 'macOS'
        run: |
          mkdir staging
          cp target/release/horama staging/
          cp target/release/horama-slint staging/
          cp LICENSE staging/
          cp README.md staging/
          tar -czvf ${{ matrix.artifact_name }} -C staging .

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.artifact_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
