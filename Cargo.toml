[package]
name = "horama"
version = "0.11.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
description = "Horama - color-managed RAW and image viewer built with Rust and egui"
authors = ["MR"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp", "bmp", "gif", "ico", "pnm", "tga"] }
tiff = "0.11"
img-parts = "0.4"
imagesize = "0.15"
qcms = "0.3"
rawloader = "0.37"
imagepipe = "0.5"
kamadak-exif = "0.6"
rfd = "0.17"
sysinfo = "0.40"
rayon = "1.10"
walkdir = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "7"
crossbeam-channel = "0.5"
log = "0.4"
# JPEG encoder that accepts the quantization tables of the original (see image_saver).
jpeg-encoder = "0.7"
# Thumbnails: decodes a JPEG directly at 1/2, 1/4 or 1/8 of its size (DCT scaling).
jpeg-decoder = { version = "0.3", default-features = false }
# The interface. glow (OpenGL) instead of the default wgpu: builds much faster.
egui = "0.37"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
notify = "8"
sys-locale = "0.3"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1" 

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# "unwind" lets a corrupt or exotic file that crashes a decoder be reported as an error
# instead of terminating the whole application (decoders run inside catch_unwind).
panic = "unwind"
strip = true

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu"] }

