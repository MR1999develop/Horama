[package]
name = "horama"
version = "0.5.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Horama - color-managed RAW and image viewer built with Rust and Slint"
authors = ["Horama Contributors"]
# `cargo run` keeps starting the current (Slint) interface; the egui one is `--bin horama-egui`.
default-run = "horama"

[dependencies]
# unstable-winit-030: files dropped from the file manager arrive only as winit events.
slint = { version = "1.18", features = ["unstable-winit-030"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp", "bmp", "gif", "ico", "pnm", "tga"] }
tiff = "0.9"
img-parts = "0.3"
imagesize = "0.15"
qcms = "0.3"
rawloader = "0.37"
imagepipe = "0.5"
kamadak-exif = "0.5"
rfd = "0.15"
sysinfo = "0.32"
rayon = "1.10"
walkdir = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
crossbeam-channel = "0.5"
log = "0.4"
# New interface (program horama-egui), under construction next to the Slint one.
# glow (OpenGL) instead of the default wgpu: shares glutin with Slint and builds much faster.
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11", "winit/default"] }
notify = "6.1"

[build-dependencies]
slint-build = "1.9"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1" 

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# "unwind" lets a corrupt or exotic file that crashes a decoder be reported as an error
# instead of terminating the whole application (decoders run inside catch_unwind).
panic = "unwind"
strip = true

