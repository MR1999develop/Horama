# cargo-deny: run by scripts/check.bat and scripts/check.sh, so locally and in CI.
# Fails on known vulnerabilities and unsound crates (RustSec), on licenses that are not
# compatible with GPL-3.0-only, and on crates from anywhere but crates.io.
# An exception goes in `ignore` with the advisory id, the reason and a review date.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# A crate that is no longer maintained fails only if Horama depends on it directly; for the
# ones further down (bincode, paste, yaml-rust, zbus parts) it is reported, and no newer
# version exists to move to.
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive or weak-copyleft licenses that can be combined with GPL-3.0-only.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0-only",
    "IJG",
    "ISC",
    "LGPL-2.1-only",
    "LGPL-3.0-only",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Zlib",
]

# rawloader declares the deprecated identifier "LGPL-2.1", which means LGPL-2.1-only.
[[licenses.clarify]]
crate = "rawloader"
expression = "LGPL-2.1-only"
license-files = []

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
